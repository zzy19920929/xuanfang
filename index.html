<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选房信息查询</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6fa;
      color: #222;
    }

    .search {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      padding: 16px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search label {
      font-weight: 600;
      white-space: nowrap;
    }

    #orderInput {
      width: 260px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #d9dce5;
      border-radius: 7px;
      font-size: 16px;
      outline: none;
    }

    #orderInput:focus {
      border-color: #466CFF;
    }

    button {
      height: 40px;
      padding: 0 16px;
      border: 0;
      border-radius: 7px;
      background: #466CFF;
      color: #fff;
      cursor: pointer;
    }

    #clearSavedBtn {
      background: #ff7b7b;
    }

    #count {
      color: #666;
      font-size: 14px;
    }

    .sheet {
      background: #fff;
      padding: 16px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
      overflow-x: auto;
    }

    .sheet h2 {
      font-size: 18px;
      margin: 0 0 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px 12px;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: #f1f3f8;
    }

    .match,
    .match td {
      background: #FD4444 !important;
      color: #fff !important;
    }

    @media (max-width: 700px) {
      body {
        padding: 10px;
      }

      .search {
        flex-wrap: wrap;
      }

      #orderInput {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="search">
    <label for="orderInput">顺序号查询</label>
    <input id="orderInput" type="text" placeholder="请输入顺序号" autocomplete="off">
    <button id="confirmBtn" type="button">确认</button>
    <button id="clearSavedBtn" type="button">清除已保存</button>
    <span id="count"></span>
  </div>

  <div id="app"></div>

  <script>
    const sheets = [

        ]

          ['3', '218', '1208', '422852', '52.66'],

          ['14', '202', '1008', '419776', '52.66'],
          ['15', '210', '1108', '418735', '52.66'],

        ]
      },
      {

          ['20', '507', '1907', '445811', '51.65']
        ]
      },
      {

        rows: [
          ['序号', '顺序号', '房号', '销售总价', '套内面积'],
          ['21', '249', '1607', '414127', '53.45'],
          ['22', '257', '1707', '412720', '53.45'],

          ['24', '225', '1307', '411313', '53.45'],

          ['26', '273', '1907', '435238', '53.45'],
          ['27', '281', '2007', '434535', '53.45'],
          ['28', '289', '2107', '433127', '53.45'],
          ['29', '297', '2207', '431720', '53.45'],
          ['30', '185', '807', '410257', '53.41'],
          ['31', '193', '907', '408443', '53.41'],
          ['32', '201', '1007', '407037', '53.41'],
          ['33', '209', '1107', '405983', '53.45'],
          ['34', '305', '2307', '444387', '53.45'],
          ['35', '313', '2407', '443683', '53.45'],
          ['36', '321', '2507', '435942', '53.45']
        ]
      },
      {
        title: '珩边一里3号楼西边套01',
        rows: [
          ['序号', '顺序号', '房号', '销售总价', '套内面积'],
          ['37', '514', '1201', '419207', '51.4'],
          ['38', '518', '2901', '448012', '51.85']
        ]
      },
      {
        title: '珩边一里3号楼东次边套07',
        rows: [
          ['序号', '顺序号', '房号', '销售总价', '套内面积'],
          ['39', '515', '1507', '427217', '51.65']
        ]
      },
      {
        title: '珩边三里2号楼中间套05',
        rows: [
          ['序号', '顺序号', '房号', '销售总价', '套内面积'],
          ['40', '247', '1605', '386815', '53.43'],
          ['41', '255', '1705', '385408', '53.43'],
          ['42', '239', '1505', '388222', '53.43'],
          ['43', '223', '1305', '384002', '53.43'],
          ['44', '215', '1205', '383299', '53.43'],
          ['45', '271', '1905', '407211', '53.43'],
          ['46', '279', '2005', '406507', '53.43'],
          ['47', '287', '2105', '405804', '53.43'],
          ['48', '295', '2205', '404398', '53.43'],
          ['49', '183', '805', '383017', '53.34'],
          ['50', '191', '905', '381014', '53.34'],
          ['51', '199', '1005', '379609', '53.34'],
          ['52', '207', '1105', '378556', '53.43'],
          ['53', '303', '2305', '416354', '53.43'],
          ['54', '311', '2405', '415650', '53.43'],
          ['55', '319', '2505', '407914', '53.43']
        ]
      }
    ];

    const app = document.getElementById('app');
    const input = document.getElementById('orderInput');
    const count = document.getElementById('count');
    const STORAGE_KEY = 'xuanfang-saved-orders';
    const savedOrderNumbers = new Set(loadSavedOrders());

    function loadSavedOrders() {
      try {
        const rawValue = localStorage.getItem(STORAGE_KEY);
        if (!rawValue) {
          return [];
        }

        const parsed = JSON.parse(rawValue);
        return Array.isArray(parsed) ? parsed.filter((item) => typeof item === 'string' && item.trim()) : [];
      } catch (error) {
        return [];
      }
    }

    function persistSavedOrders() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(savedOrderNumbers)));
    }

    function render() {
      app.innerHTML = '';

      sheets.forEach(sheet => {
        const section = document.createElement('section');
        section.className = 'sheet';

        const h = document.createElement('h2');
        h.textContent = sheet.title;
        section.appendChild(h);

        const table = document.createElement('table');

        const thead = document.createElement('thead');
        const header = document.createElement('tr');

        sheet.rows[0].forEach(value => {
          const th = document.createElement('th');
          th.textContent = value;
          header.appendChild(th);
        });

        thead.appendChild(header);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');

        sheet.rows.slice(1).forEach(row => {
          const tr = document.createElement('tr');
          const orderNumber = row[1] ? row[1].trim() : '';

          if (savedOrderNumbers.has(orderNumber)) {
            tr.classList.add('match');
          }

          tr.dataset.orderNumber = orderNumber;

          row.forEach(value => {
            const td = document.createElement('td');
            td.textContent = value;
            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        section.appendChild(table);
        app.appendChild(section);
      });
    }

    function getMatchedRows(keyword) {
      const matches = [];

      sheets.forEach(sheet => {
        sheet.rows.slice(1).forEach(row => {
          const orderNumber = row[1] ? row[1].trim() : '';

          if (orderNumber === keyword) {
            matches.push(row);
          }
        });
      });

      return matches;
    }

    function search() {
      const keyword = input.value.trim();

      if (!keyword) {
        count.textContent = '';
        return;
      }

      const matchedRows = getMatchedRows(keyword);

      if (matchedRows.length === 0) {
        count.textContent = '未找到该顺序号';
        return;
      }

      savedOrderNumbers.add(keyword);
      persistSavedOrders();
      render();

      const first = document.querySelector('#app tbody tr[data-order-number="' + keyword + '"]');
      count.textContent = '本次找到 ' + matchedRows.length + ' 条，已保存';

      if (first) {
        first.scrollIntoView({
          behavior: 'smooth',
          block: 'center'
        });
      }
    }

    function clearSavedOrders() {
      if (savedOrderNumbers.size === 0) {
        count.textContent = '当前没有已保存的顺序号';
        return;
      }

      const confirmed = window.confirm('确定清除所有已保存的顺序号吗？');

      if (!confirmed) {
        return;
      }

      savedOrderNumbers.clear();
      persistSavedOrders();
      render();
      input.value = '';
      count.textContent = '已清除所有已保存的顺序号';
    }

    render();

    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        search();
      }
    });

    document.getElementById('confirmBtn').addEventListener('click', search);
    document.getElementById('clearSavedBtn').addEventListener('click', clearSavedOrders);
  </script>
</body>

</html>
